<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Browse Recipes</title>
    <link rel="stylesheet" href="../static/css/main.css" />
    <style> td {
  height: 80px;
  width: 160px;
  text-align: center;
  vertical-align: middle;
}</style>
</head>

<body>

    <header id="header">
        <h1>CS235 2025: My Recipe Library</h1>
        <div class="copyright">&copy; UPI1 | UPI2 | UPI3</div>
    </header>

    <h1>Total Recipes - {{ number_of_recipes }} </h1>

    <p>Number of recipes received: {{ recipes|length }}</p>
    <!-- Recipes table layout -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>DESCRIPTION</th>
            </tr>
        </thead>
        <tbody>
            {% for recipe in recipes %}
            <tr>
                <td>
                    {{ recipe.id }}
                </td>
                <td>
                    {{ recipe.name }}
                </td>
                <td>
                    {{ recipe.description }}
                </td>

            </tr>
            {% endfor %}
        </tbody>
    </table>


</body>

</html>
